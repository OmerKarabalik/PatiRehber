name: Build iOS & Android Test Packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios-simulator:
    name: Build iOS Simulator App (Appetize Compatible)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Simulator
        run: flutter build ios --simulator

      - name: Package iOS Simulator App for Appetize
        run: |
          cd build/ios/iphonesimulator
          zip -r PatiRehber-iOS-Appetize.zip Runner.app
          mv PatiRehber-iOS-Appetize.zip ../../../

      - name: Upload iOS Appetize Zip
        uses: actions/upload-artifact@v4
        with:
          name: PatiRehber-iOS-Appetize
          path: PatiRehber-iOS-Appetize.zip

  build-android-apk:
    name: Build Android Test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PatiRehber-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
