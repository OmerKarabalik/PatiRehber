name: Build and Upload iOS App Store Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ios-appstore-build
  cancel-in-progress: true

jobs:
  build-and-upload-appstore:
    name: Build & Upload to App Store Connect
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Pre-compile Flutter iOS Release Assets
        run: |
          flutter build ios --release --no-codesign

      - name: Sign, Build IPA and Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # 1. Create temporary keychain
          export KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          export KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # 2. Run Fastlane to fetch/create certificate, build IPA, and upload
          gem install fastlane --no-document
          cd ios
          fastlane prepare_signing
          fastlane build_and_upload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PatiRehber-iOS-AppStore-IPA
          path: build/ios/ipa/*.ipa
